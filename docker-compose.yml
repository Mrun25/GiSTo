version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gisto
      POSTGRES_PASSWORD: gisto
      POSTGRES_DB: gisto
    volumes:
      - gisto_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gisto"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://gisto:gisto@db:5432/gisto
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  bot:
    build: ./bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    environment:
      BACKEND_BASE_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./bot:/app

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    environment:
      VITE_BACKEND_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  gisto_db_data:
